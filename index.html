<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oltretempo | Le Coordinate Mobili</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f14;
            --card-bg: #131b24;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.15);
            --border: #22303c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }
        input[type="date"], input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: #0b0f14;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #0b0f14;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        button:hover {
            background: #e6c547;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .result-box {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
            display: none;
        }
        .result-title {
            font-family: 'Cinzel', serif;
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .result-card {
            background: #0b0f14;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cbd5e1;
        }
        .result-card strong {
            color: var(--accent);
            display: block;
            margin-bottom: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
        }
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Oltretempo</h1>
        <div class="subtitle">Le Coordinate Mobili dello Zero</div>

        <div id="input-section">
            <div class="form-group">
                <label for="birthDate">Data di Nascita (Anagrafica):</label>
                <input type="date" id="birthDate" required>
            </div>

            <div class="form-group">
                <label for="locationText">Dove ti trovi ora? (Spazio dell'Attrito):</label>
                <input type="text" id="locationText" placeholder="Es. In ufficio, in mezzo al traffico, sotto un albero..." required>
            </div>

            <button onclick="calculateCoordinates()">Rileva il Campo</button>
        </div>

        <div id="resultSection" class="result-box">
            <div class="result-title">⚡ Bollettino del Presente</div>
            
            <div class="result-card">
                <strong>Map Center (Il Grembo Originario)</strong>
                <p id="resMapCenter"></p>
            </div>

            <div class="result-card">
                <strong>Il Punto "Es-Deale" a <span id="resLocationName"></span></strong>
                <p id="resFriction"></p>
            </div>

            <div class="result-card">
                <strong>Il Gesto del Matto</strong>
                <p id="resFoolAction"></p>
            </div>

            <button onclick="resetApp()" style="background: transparent; border: 1px solid var(--border); color: var(--text-secondary); margin-top: 15px; font-family: inherit; font-size: 0.85rem;">Nuova Lettura</button>
        </div>

        <div class="footer-note">Fuori dalle griglie del sistema • Libero da etichette</div>
    </div>

    <script>
        function calculateCoordinates() {
            const birthVal = document.getElementById('birthDate').value;
            const locVal = document.getElementById('locationText').value.trim();

            if (!birthVal || !locVal) {
                alert("Inserisci sia la data di nascita che il luogo in cui ti trovi.");
                return;
            }

            const birthDate = new Date(birthVal);
            // Calcolo del Map Center nel quarto mese e mezzo di gestazione (circa 138 giorni prima)
            const mapCenterDate = new Date(birthDate.getTime() - (138 * 24 * 60 * 60 * 1000));
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const formattedMapCenter = mapCenterDate.toLocaleDateString('it-IT', options);

            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));

            const frictions = [
                "Lì a " + locVal + ", il sistema cerca di agganciarsi alla tua maschera anagrafica con pretese e scadenze. Ma l'impatto si infrange contro il Punto 'Es-Deale': le proiezioni e i loop tossici colpiscono solo il nome sociale; dal tuo grembo fetale risulti completamente intoccabile e invisibile.",
                "L'attrito odierno a " + locVal + " tenta di forzare il controllo sugli eventi. Raggiungere il Punto 'Es-Deale' significa accettare che questa situazione non può essere manipolata dalla logica: lascia cadere la pretesa di raddrizzarla.",
                "Nel crocevia di " + locVal + ", le aspettative esterne e le vecchie memorie familiari premono sul campo. Il Punto 'Es-Deale' ti mostra il limite esatto in cui la mente si arrende al Mistero, rendendoti immune a ogni condizionamento.",
                "Tra le richieste del mondo a " + locVal + " e il tuo respiro, oggi si sperimenta il Punto 'Es-Deale': il punto d'arresto in cui ogni sforzo di pianificazione sbatte contro l'imprevedibile marea dell'Etere."
            ];

            const foolActions = [
                "Fai il Salto del Matto: rilascia ogni controllo, fai tre respiri profondi radendoti al suolo e affidati ciecamente alla marea dell'Etere, fuori da ogni griglia.",
                "Rinuncia a replicare o a spiegarti. Agisci come un ospite invisibile che attraversa il muro dell'attrito senza lasciare tracce né aspettarsi ricompense.",
                "Riconosci che non devi risolvere nulla oggi. Sorridi al caos di " + locVal + " e fai un passo nell'ignoto, confidando nella spinta originaria del tuo liquido amniotico.",
                "Deponi le armi della ragione: fai un piccolo gesto fuori schema, slegato da ogni logica di profitto o difesa, e senti la leggerezza del Matto."
            ];

            const index1 = (dayOfYear + locVal.length) % frictions.length;
            const index2 = (dayOfYear * 3) % foolActions.length;

            document.getElementById('resMapCenter').innerText = "Collocato nel tempo ipogeo del quarto mese e mezzo (" + formattedMapCenter + "). Immersi nel liquido amniotico, la 'maledizione' della data anagrafica svanisce e rinasci intoccabile.";
            document.getElementById('resLocationName').innerText = locVal;
            document.getElementById('resFriction').innerText = frictions[index1];
            document.getElementById('resFoolAction').innerText = foolActions[index2];

            document.getElementById('input-section').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
        }

        function resetApp() {
            document.getElementById('birthDate').value = '';
            document.getElementById('locationText').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('input-section').style.display = 'block';
        }
    </script>
</body>
</html>
