<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IL LIBRO SACRO DI OLTRETEMPO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #08080a;
            --bronze-gold: #d49a5b;
            --bronze-light: #f0c38d;
            --bronze-dim: rgba(212, 154, 91, 0.25);
            --bronze-glow: rgba(212, 154, 91, 0.4);
            --panel-bg: rgba(15, 13, 18, 0.65);
            --text-main: #e2dacd;
            --text-muted: #8c8275;
            --border-bronze: rgba(212, 154, 91, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(212, 154, 91, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(10, 10, 12, 0.95) 0%, transparent 80%);
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1050px;
            background: rgba(12, 11, 15, 0.85);
            border: 1px solid var(--border-bronze);
            border-radius: 8px;
            padding: 2.5rem 2rem 1.5rem 2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(212, 154, 91, 0.08);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .main-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--bronze-gold);
            text-shadow: 0 0 12px var(--bronze-glow);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .interface-grid {
            display: grid;
            grid-template-columns: 1fr 300px 1fr;
            gap: 1.5rem;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .nav-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-bronze);
            color: var(--text-main);
            padding: 0.85rem 1.2rem;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }

        .nav-btn:hover {
            border-color: var(--bronze-gold);
            color: var(--bronze-light);
            box-shadow: 0 0 15px var(--bronze-dim), inset 0 0 12px var(--bronze-dim);
            transform: translateY(-2px);
        }

        .nav-btn.btn-highlight {
            border-color: var(--bronze-gold);
            background: rgba(212, 154, 91, 0.15);
            box-shadow: 0 0 10px var(--bronze-dim);
        }

        .center-emblem {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-bronze);
            border-radius: 50%;
            animation: rotateHUD 50s linear infinite;
        }

        .hud-ring::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            width: 10px;
            height: 10px;
            background: var(--bronze-gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--bronze-gold);
            transform: translateX(-50%);
        }

        .emblem-img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            mix-blend-mode: screen; /* Fonde il fondo nero dell'immagine con la card */
            filter: drop-shadow(0 0 15px rgba(212, 154, 91, 0.4));
        }

        @keyframes rotateHUD {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .search-bar-container {
            max-width: 650px;
            margin: 0 auto 2rem auto;
            position: relative;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(10, 9, 12, 0.9);
            border: 1px solid var(--border-bronze);
            border-radius: 25px;
            padding: 0.6rem 1.5rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--bronze-light);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .search-icon {
            color: var(--bronze-gold);
            font-size: 1.1rem;
            cursor: pointer;
        }

        footer {
            border-top: 1px solid rgba(212, 154, 91, 0.15);
            padding-top: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .footer-info {
            text-align: center;
            line-height: 1.4;
        }

        .footer-status-bar {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            color: var(--bronze-gold);
            font-size: 0.9rem;
        }

        .status-icon {
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .status-icon:hover {
            opacity: 1;
        }

        @media (max-width: 850px) {
            .interface-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .center-emblem {
                order: -1;
                width: 220px;
                height: 220px;
            }

            .main-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1 class="main-title">IL LIBRO SACRO DI OLTRETEMPO</h1>

        <div class="interface-grid">
            <div class="nav-column">
                <a href="#" class="nav-btn">Archivio degli Echi</a>
                <a href="#" class="nav-btn">Chronache del Vril</a>
                <a href="#" class="nav-btn">Registri Morontiali</a>
                <a href="#" class="nav-btn">Contatti</a>
            </div>

            <div class="center-emblem">
                <div class="hud-ring"></div>
                <img src="tartaruga.png" alt="Tartaruga OLTRETEMPO" class="emblem-img">
            </div>

            <div class="nav-column">
                <a href="#" class="nav-btn">Biblioteca del Silenzio</a>
                <a href="#" class="nav-btn">Tempo di Lettura</a>
                <a href="#" class="nav-btn">Lore & Dati</a>
                <a href="#" class="nav-btn">Zero dei Tarocchi</a>
                <a href="#" class="nav-btn btn-highlight">Registrati</a>
            </div>
        </div>

        <div class="search-bar-container">
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="CERCA NELL'ETERE...">
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <footer>
            <div class="footer-info">
                © 2028 - TUTTI I DIRITTI RISERVATI<br>
                OLTRETEMPO DIGITAL ARCHIVE<br>
                V. 3.125
            </div>
            <div class="footer-status-bar">
                <span class="status-icon" title="Segnale Wi-Fi">📡</span>
                <span class="status-icon" title="Frequenza Madre">🌐</span>
                <span class="status-icon" title="Profilo Utente">👤</span>
                <span class="status-icon" title="Impostazioni">⚙️</span>
            </div>
        </footer>
    </div>

</body>
</html>
